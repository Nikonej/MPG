<!DOCTYPE html>

    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
      table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
        tr:nth-child(even) { background: #efefef; }
      }
      /* Tooltip container */
    .tooltip {
      position: relative;
      display: inline-block;
      border-bottom: 1px dotted rgb(0, 0, 0); /* Add dots under the hoverable text */
      cursor: pointer;
    }

    td.tooltip {
      display: table-cell;
      border-bottom: none;
    }

    .line2 {
      position: relative;
      display: inline-block;
      bottom: 43px;
    }

    .tooltiptext {
      visibility: hidden;
      width: 300px;
      background-color: rgb(255, 255, 255);
      color: #000000;
      text-align: center;
      padding: 5px 0;
      border-radius: 6px;
      position: absolute;
      z-index: 1; 
    }
    .tooltip:hover .tooltiptext {
      visibility: visible;
    }
    .subclass {
      display:block; 
      position:absolute; 
      left:0px;
      top:75px
    }

    .subclasses {
      display:block; 
      position:relative; 
      bottom: 19px;
      right:220px;
    }
    </style>

        const skillsel = document.getElementsByClassName('skillsel');
        const lvl = document.getElementById('lvl');
        const hp = document.getElementById('hp');
        const mp = document.getElementById('mp');
        const hpmaxtxt = document.getElementById('hpmaxtxt');
        const mpmaxtxt = document.getElementById('mpmaxtxt');
        const movtxt = document.getElementById('movtxt');
        const critchancetxt = document.getElementById('critchancetxt');
        const critdamagetxt = document.getElementById('critdamagetxt');
        const inittxt = document.getElementById('inittxt');
        const hpchange = document.getElementById('hpchange');
        const mpchange = document.getElementById('mpchange');
        const racefeature1 = document.getElementById('racefeature1');
        const racefeature2 = document.getElementById('racefeature2');
        const basicname = document.getElementById('basicname');
        const tohit = document.getElementById('tohit');
        const dmg = document.getElementById('dmg');
        const range = document.getElementById('range');
        const effect = document.getElementById('effect');
        const effectadv = document.getElementById('effectadv');
        const skill1sel = document.getElementById('skill1sel'); const skill1desc = document.getElementById('skill1desc'); const skill1mana = document.getElementById('skill1mana'); const skill1uses = document.getElementById('skill1uses'); const skill1ap = document.getElementById('skill1ap');
        const skill2sel = document.getElementById('skill2sel'); const skill2desc = document.getElementById('skill2desc'); const skill2mana = document.getElementById('skill2mana'); const skill2uses = document.getElementById('skill2uses'); const skill2ap = document.getElementById('skill2ap');
        var subclass = "", masteryStat = "";
        var body = 0, senses = 0, mind = 0, fortune = 0, mastery = 1, maxhp = 0, maxmp = 0, mov=0, init=0, critchance=0, critdamage=0;
        var hpbonus = 0, mpbonus = 0, critchancebonus = 0, critdamagebonus = 0, movementbonus = 0, initbonus=0;
        warrior.style.display = "none"
        wlabel.style.display = "none"
        mage.style.display = "none"
        mlabel.style.display = "none"
        ecc.style.display = "none"
        elabel.style.display = "none"
        scoundrel.style.display = "none"
        slabel.style.display = "none"
        verdant.style.display = "none"
        vlabel.style.display = "none"
        psion.style.display = "none"
        plabel.style.display = "none"
        harm.style.display = "none"
        hlabel.style.display = "none"
        pug.style.display = "none"
        pulabel.style.display = "none"

        socket.on('connection', (data) => {
          update(data);
        })
        classs.addEventListener('change', (e) => {
            e.preventDefault();
            updateStats()
            hp.value = hpmax;
            mp.value = mpmax;
            sendData();
            displaySubclasses(classs.value);
        });
        

        for (let i = 0; i < subclasses.length; i++){
          subclasses[i].addEventListener('change', (e) => {
           e.preventDefault();
            subclass = subclasses[i].value;
            sendData()
        });}


        race.addEventListener('change', (e) => {
          e.preventDefault();
          updateStats()
          hp.value = hpmax;
          mp.value = mpmax;
          sendData()
        });

        for (let i = 0; i < write.length; i++){
          write[i].addEventListener('change', (e) => {
            e.preventDefault();
            document.getElementsByTagName("TITLE")[0].text = name.value;
            if (write[i].id=="hpchange"){
              hp.value-=parseInt(write[i].value);
              write[i].value = "";
            } else if (write[i].id=="mpchange"){
              mp.value-=parseInt(write[i].value);
              write[i].value = "";
            }
            sendData()
        });}

        /*name.addEventListener('change', (e) => {
          e.preventDefault();
          document.getElementsByTagName("TITLE")[0].text = name.value;
          sendData()
        });*/
        for (let i = 0; i < masteries.length; i++){
          masteries[i].addEventListener('change', (e) => {
           e.preventDefault();
          updateStats();
          sendData();
        });}

        

          socket.on('charupdate', (data) =>{
            let chars = [data]
            update({l:1, chars});
        })
        function sendData(){
          socket.emit('change', {name: name.value, sheet: 0, race: race.value, classs:classs.value, subclass:subclass, body: body, senses: senses, mind: mind, fortune: fortune, masteryStat: masteryStat, lvl:lvl.value, hp:hp.value, mp:mp.value, skill1sel:skill1sel.value, skill2sel:skill2sel.value});
        }
        function updateStats(){
          body = 0;
          senses = 0;
          mind = 0;
          fortune = 0;
          switch(classs.value){
              case("warrior"):
                body += 4;
                senses += 2;
                mind += 1;
                fortune += 1;
              break;
              case("mage"):
                body += 1;
                senses += 1;
                mind += 4;
                fortune += 2;
              break;
              case("scoundrel"):
                body += 1;
                senses += 3;
                mind += 1;
                fortune += 3;
              break;
              case("ecc"):
                body += 2;
                senses += 1;
                mind += 3;
                fortune += 2;
              break;
              case("psion"):
                body += 1;
                senses += 2;
                mind += 4;
                fortune += 1
              break;
              case("harm"):
                body += 1;
                senses += 2;
                mind += 2;
                fortune += 3;
              break;
              case("pug"):
                body += 3;
                senses += 3;
                mind += 1;
                fortune += 1
              break;
            }
            switch(race.value){
              case("human"):
                body += 1;
                senses += 1;
                mind += 1;
                fortune += 1;
              break;
              case("elf"):
                body += 0;
                senses += 2;
                mind += 1;
                fortune += 0;
              break;
              case("halfling"):
                body += 0;
                senses += 1;
                mind += 0;
                fortune += 2;
              break;
              case("orc"):
                body += 2;
                senses += 1;
                mind += 0;
                fortune += 0;
              break;

                mind += 0;

                mind += 0;
                fortune += 1;
              break;
              case("custom"):

                senses += 0;

              break;

            if (bodyMastery.checked){

              //body += mastery
            } else if (sensesMastery.checked){

              //senses += mastery;
            } else if (mindMastery.checked){

              //mind += mastery
            } else if (fortuneMastery.checked){
              masteryStat = "fortune";
              //fortune += mastery
            } else {

            }

                sensesMastery.checked = false
                mindMastery.checked = false
                fortuneMastery.checked = false
              break;

              break;

                mindMastery.checked = false

              }
            }

            }
          }

          critdamagetxt.textContent = critdamage;
