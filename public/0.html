<!DOCTYPE html>

    <style>

      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
      table, th, td {
        border: 1px solid black;

  <nav>

            name.value=data.chars[0].name
            document.getElementsByTagName("TITLE")[0].text = data.chars[0].name
            race.value = data.chars[0].race
            classs.value = data.chars[0].classs

            senses = data.chars[0].senses;
            mind = data.chars[0].mind;
            fortune = data.chars[0].fortune;
            displaySubclasses(data.chars[0].classs, data);
        })

            e.preventDefault();
            displaySubclasses(classs.value);
            bodytxt.textContent = "sd"
            socket.emit('change', {name: name.value, sheet: 0, race: race.value, classs:classs.value, body: body, senses: senses, mind: mind, fortune: fortune});
        });
